<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Titanic 3D Viewer</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; }
      #app { width: 100%; height: 100%; }
      #info {
        position: absolute;
        top: 16px;
        left: 16px;
        color: #e0e0e0;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 14px;
        background: rgba(0,0,0,0.45);
        padding: 10px 16px;
        border-radius: 8px;
        pointer-events: none;
        user-select: none;
      }
      #info h1 { font-size: 16px; font-weight: 600; margin-bottom: 2px; }
      #info p { font-size: 12px; opacity: 0.7; }
      #loading {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        color: #e0e0e0;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="info">
      <h1>Titanic 3D Model</h1>
      <p>Drag to rotate · Scroll to zoom · Right-drag to pan</p>
    </div>
    <div id="loading">Loading model…</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
